<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - وحدة الدعم المساندة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif !important;
        }
        body {
            background-color: #f4f7f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 400px;
            border: 1px solid #eef2f5;
            text-align: center;
        }
        h2 {
            color: #1F4E78;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }
        .mb-3 {
            margin-bottom: 15px;
            text-align: right;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #34495e;
        }
        .form-control {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
        }
        .form-control:focus {
            border-color: #1F4E78;
            box-shadow: 0 0 0 3px rgba(31, 78, 120, 0.12);
        }
        .btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            background-color: #1F4E78;
            color: white;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .btn:hover {
            background-color: #163a5d;
        }
        .error-msg {
            background-color: #fee2e2;
            color: #991b1b;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 15px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>تسجيل الدخول - وحدة الدعم</h2>
        
        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="mb-3">
                <label>اسم المستخدم</label>
                <input type="text" name="username" class="form-control" placeholder="مثال: abdullah" required autocomplete="off">
            </div>

            <div class="mb-3">
                <label>كلمة المرور</label>
                <input type="password" name="password" class="form-control" placeholder="أدخل كلمة المرور" required>
            </div>

            <button type="submit" class="btn">دخول</button>
        </form>
    </div>
</body>
</html>
